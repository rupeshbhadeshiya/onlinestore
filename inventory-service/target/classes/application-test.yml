# Pub/Sub Topics (Apache Kafka)
onlinestore:
  inventory:
    events:
      topic:
        name: InventoryEventsTopic_Test
  cart:
    events:
      topic:
        name: CartEventsTopic_Test
  order:
    events:
      topic:
        name: OrderEventsTopic_Test