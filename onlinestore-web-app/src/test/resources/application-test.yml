# This Service run related configurations
server:
  # This service will be listening over port 9010
  port: '8100'
  # web context root name
  servlet:
    context-path: /onlinestore

spring:

  # Service Name using which other services locates its instances from Service Registry
  application:
    name: onlinestore-web-app

  # Database configurations: H2   
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password: password

  # JPA specific configurations
  jpa:
    show-sql: 'true'
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

  # Spring Web MVC related configurations
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

# Details of Service Discovery to which this service registers itself so other services can discover its instances and call it
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: 'false'

# Pub/Sub Topics (Apache Kafka)
onlinestore:
  cart:
    events:
      topic:
        name: CartEventsTopic
